<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up — Students Corner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&display=swap" rel="stylesheet">
<style>
  :root {
    --cork: #E0A100;
    --cork-dark: #B87F00;
    --paper: #FFFFFF;
    --paper-shadow: #EFEFEF;
    --ink: #2B2118;
    --pin-teal: #2E5F58;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--cork);
    background-image:
      radial-gradient(circle at 20% 30%, rgba(0,0,0,0.08) 0%, transparent 2%),
      radial-gradient(circle at 70% 60%, rgba(0,0,0,0.07) 0%, transparent 2%),
      radial-gradient(circle at 40% 80%, rgba(0,0,0,0.06) 0%, transparent 1.5%),
      radial-gradient(circle at 85% 15%, rgba(0,0,0,0.05) 0%, transparent 1.5%),
      linear-gradient(135deg, var(--cork) 0%, var(--cork-dark) 100%);
    font-family: 'Inter', sans-serif;
    color: var(--ink);
    min-height: 100vh;
    padding: 40px 20px 80px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .wrap { max-width: 440px; width: 100%; }

  .topnav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 32px;
  }

  .back {
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 13px;
    color: var(--paper);
    text-decoration: none;
    border: 1.5px solid var(--paper);
    padding: 7px 14px;
    border-radius: 3px;
    transition: background 0.15s ease;
  }
  .back:hover { background: rgba(255,255,255,0.15); }

  .brand {
    font-family: 'Permanent Marker', cursive;
    font-size: 20px;
    color: var(--paper);
    text-shadow: 1px 1px 0 rgba(0,0,0,0.2);
  }

  header { text-align: center; margin-bottom: 28px; }

  .eyebrow {
    display: inline-block;
    font-family: 'Courier Prime', monospace;
    font-weight: 700;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    font-size: 11px;
    color: var(--paper);
    background: var(--pin-teal);
    padding: 5px 12px;
    transform: rotate(-1deg);
    margin-bottom: 14px;
  }

  h1 {
    font-family: 'Permanent Marker', cursive;
    font-size: clamp(28px, 6vw, 38px);
    color: var(--paper);
    text-shadow: 2px 2px 0 rgba(0,0,0,0.2);
  }

  .sub {
    margin-top: 8px;
    font-size: 14px;
    color: var(--paper);
    opacity: 0.9;
  }

  form {
    background: var(--paper);
    padding: 32px 28px 28px;
    box-shadow: 0 10px 20px rgba(0,0,0,0.25);
    position: relative;
    transform: rotate(0.3deg);
  }

  .pin {
    position: absolute;
    top: -14px;
    left: 50%;
    transform: translateX(-50%);
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #7a9fd6, var(--pin-teal));
    box-shadow: 0 3px 4px rgba(0,0,0,0.4);
  }

  .field { margin-bottom: 16px; }

  .field label {
    display: block;
    font-family: 'Courier Prime', monospace;
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #6b6255;
    margin-bottom: 6px;
  }

  .two-col {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }

  @media (max-width: 420px) {
    .two-col { grid-template-columns: 1fr; }
  }

  input[type="text"],
  input[type="tel"],
  input[type="email"],
  input[type="password"] {
    width: 100%;
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    padding: 10px 12px;
    border: 1.5px solid var(--paper-shadow);
    border-radius: 3px;
    background: #FCFCFA;
    color: var(--ink);
  }

  input:focus { outline: none; border-color: var(--pin-teal); }

  .terms {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    font-size: 12px;
    color: #4a4136;
    margin-bottom: 20px;
    line-height: 1.4;
  }

  .terms input { margin-top: 3px; }
  .terms a { color: var(--pin-teal); font-weight: 600; text-decoration: none; }
  .terms a:hover { text-decoration: underline; }

  .submit-btn {
    width: 100%;
    font-family: 'Permanent Marker', cursive;
    font-size: 18px;
    letter-spacing: 0.02em;
    color: var(--paper);
    background: var(--pin-teal);
    border: none;
    padding: 13px;
    border-radius: 3px;
    cursor: pointer;
    box-shadow: 0 5px 10px rgba(0,0,0,0.25);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }

  .submit-btn:hover { transform: translateY(-2px); box-shadow: 0 7px 14px rgba(0,0,0,0.3); }
  .submit-btn:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }

  .switch {
    text-align: center;
    font-size: 13px;
    margin-top: 18px;
    color: #4a4136;
  }
  .switch a { color: var(--pin-teal); font-weight: 600; text-decoration: none; }
  .switch a:hover { text-decoration: underline; }

  .error {
    display: none;
    background: #FBE4D8;
    border: 1.5px solid #C1440E;
    color: #C1440E;
    font-size: 13px;
    padding: 10px 12px;
    border-radius: 4px;
    margin-bottom: 16px;
    font-weight: 600;
  }
</style>
</head>
<body>

<div class="wrap">
  <nav class="topnav">
    <a class="back" href="index.html">← Back to board</a>
    <span class="brand">Students Corner</span>
  </nav>

  <header>
    <span class="eyebrow">Join the board</span>
    <h1>Sign Up</h1>
    <p class="sub">Create an account to post and respond to notices.</p>
  </header>

  <form id="signupForm">
    <span class="pin"></span>

    <div class="error" id="errorMsg">Please fill in all required fields.</div>

    <div class="field">
      <label for="fullName">Full name</label>
      <input type="text" id="fullName" name="fullName" placeholder="Your full name" required>
    </div>

    <div class="two-col">
      <div class="field">
        <label for="phone">Phone number</label>
        <input type="tel" id="phone" name="phone" placeholder="1234567890" required>
      </div>
      <div class="field">
        <label for="email">College Email</label>
        <input type="email" id="email" name="email" placeholder="1234567890@iiitvadodara.ac.in" required>
      </div>
    </div>

    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" placeholder="Create a password" required>
    </div>

    <label class="terms">
      <input type="checkbox" id="terms" name="terms" required>
      <span>I agree to keep my contact details accurate, since they're used to help others reach me safely about lost and found items.</span>
    </label>

    <button type="submit" class="submit-btn">Create Account</button>

    <p class="switch">Already have an account? <a href="login.html">Log in</a></p>
  </form>
</div>

<script>
  document.getElementById('signupForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const name = document.getElementById('fullName').value.trim();
    const phone = document.getElementById('phone').value.trim();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value.trim();
    const terms = document.getElementById('terms').checked;
    if (!name || !phone || !email || !password || !terms) {
      document.getElementById('errorMsg').style.display = 'block';
      return;
    }
    window.location.href = 'profile.html';
  });
</script>

</body>
</html>
