<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Report a Lost Item — Student Corner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&display=swap" rel="stylesheet">
<style>
  :root {
    --cork: #E0A100;
    --cork-dark: #B87F00;
    --paper: #FFFFFF;
    --paper-shadow: #EFEFEF;
    --ink: #2B2118;
    --pin-red: #C1440E;
    --found-green: #3F6C51;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--cork);
    background-image:
      radial-gradient(circle at 20% 30%, rgba(0,0,0,0.08) 0%, transparent 2%),
      radial-gradient(circle at 70% 60%, rgba(0,0,0,0.07) 0%, transparent 2%),
      radial-gradient(circle at 40% 80%, rgba(0,0,0,0.06) 0%, transparent 1.5%),
      radial-gradient(circle at 85% 15%, rgba(0,0,0,0.05) 0%, transparent 1.5%),
      linear-gradient(135deg, var(--cork) 0%, var(--cork-dark) 100%);
    font-family: 'Inter', sans-serif;
    color: var(--ink);
    min-height: 100vh;
    padding: 40px 20px 80px;
  }

  .wrap { max-width: 620px; margin: 0 auto; }

  .topnav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 32px;
  }

  .back {
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 13px;
    color: var(--paper);
    text-decoration: none;
    border: 1.5px solid var(--paper);
    padding: 7px 14px;
    border-radius: 3px;
    transition: background 0.15s ease;
  }
  .back:hover { background: rgba(255,255,255,0.15); }

  .brand {
    font-family: 'Permanent Marker', cursive;
    font-size: 20px;
    color: var(--paper);
    text-shadow: 1px 1px 0 rgba(0,0,0,0.2);
  }

  header { text-align: center; margin-bottom: 32px; }

  .eyebrow {
    display: inline-block;
    font-family: 'Courier Prime', monospace;
    font-weight: 700;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    font-size: 11px;
    color: var(--paper);
    background: var(--pin-red);
    padding: 5px 12px;
    transform: rotate(-1deg);
    margin-bottom: 14px;
  }

  h1 {
    font-family: 'Permanent Marker', cursive;
    font-size: clamp(30px, 6vw, 44px);
    color: var(--paper);
    text-shadow: 2px 2px 0 rgba(0,0,0,0.2);
    line-height: 1.1;
  }

  .sub {
    margin-top: 10px;
    font-size: 14px;
    color: var(--paper);
    opacity: 0.9;
  }

  form {
    background: var(--paper);
    padding: 32px 28px;
    box-shadow: 0 10px 20px rgba(0,0,0,0.25);
    position: relative;
    transform: rotate(-0.3deg);
  }

  .pin {
    position: absolute;
    top: -14px;
    left: 50%;
    transform: translateX(-50%);
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #e06a3f, var(--pin-red));
    box-shadow: 0 3px 4px rgba(0,0,0,0.4);
  }

  .field { margin-bottom: 20px; }

  .field label {
    display: block;
    font-family: 'Courier Prime', monospace;
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #6b6255;
    margin-bottom: 6px;
  }

  .two-col {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }

  @media (max-width: 480px) {
    .two-col { grid-template-columns: 1fr; }
  }

  input[type="text"],
  input[type="tel"],
  input[type="email"],
  input[type="date"],
  select,
  textarea {
    width: 100%;
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    padding: 10px 12px;
    border: 1.5px solid var(--paper-shadow);
    border-radius: 3px;
    background: #FCFCFA;
    color: var(--ink);
  }

  input:focus, select:focus, textarea:focus {
    outline: none;
    border-color: var(--cork-dark);
  }

  textarea { resize: vertical; min-height: 80px; }

  /* Photo upload */
  .photo-drop {
    border: 2px dashed var(--paper-shadow);
    border-radius: 4px;
    padding: 22px;
    text-align: center;
    cursor: pointer;
    position: relative;
    background: #FCFCFA;
    transition: border-color 0.15s ease, background 0.15s ease;
  }

  .photo-drop:hover, .photo-drop.dragover {
    border-color: var(--cork-dark);
    background: #FFF8E8;
  }

  .photo-drop input[type="file"] {
    position: absolute;
    inset: 0;
    opacity: 0;
    cursor: pointer;
  }

  .photo-drop .hint {
    font-size: 13px;
    color: #6b6255;
  }

  .photo-drop .hint strong { color: var(--ink); }

  #previewGrid {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 14px;
  }

  .thumb {
    width: 72px;
    height: 72px;
    border-radius: 3px;
    overflow: hidden;
    position: relative;
    box-shadow: 0 2px 5px rgba(0,0,0,0.2);
  }

  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }

  .thumb button {
    position: absolute;
    top: 2px;
    right: 2px;
    width: 18px;
    height: 18px;
    border: none;
    border-radius: 50%;
    background: rgba(0,0,0,0.6);
    color: #fff;
    font-size: 11px;
    line-height: 1;
    cursor: pointer;
  }

  .submit-btn {
    width: 100%;
    font-family: 'Permanent Marker', cursive;
    font-size: 18px;
    letter-spacing: 0.02em;
    color: var(--paper);
    background: var(--pin-red);
    border: none;
    padding: 14px;
    border-radius: 3px;
    cursor: pointer;
    margin-top: 8px;
    box-shadow: 0 5px 10px rgba(0,0,0,0.25);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }

  .submit-btn:hover { transform: translateY(-2px); box-shadow: 0 7px 14px rgba(0,0,0,0.3); }
  .submit-btn:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }

  .note {
    text-align: center;
    font-family: 'Courier Prime', monospace;
    font-size: 12px;
    color: var(--paper);
    opacity: 0.75;
    margin-top: 18px;
  }

  .success {
    display: none;
    background: #EAF3EC;
    border: 1.5px solid var(--found-green);
    color: var(--found-green);
    font-size: 14px;
    padding: 12px 14px;
    border-radius: 4px;
    margin-bottom: 18px;
    font-weight: 600;
  }
</style>
</head>
<body>

<div class="wrap">
  <nav class="topnav">
    <a class="back" href="index.html">← Back to board</a>
    <span class="brand">Students Corner</span>
  </nav>

  <header>
    <h1>Report a Lost Item</h1>
    <p class="sub">Give as much detail as you can — it's what helps a neighbor spot it.</p>
  </header>

  <form id="lostForm">
    <span class="pin"></span>

    <div class="success" id="successMsg">Your notice has been pinned to the board. Thank You</div>

    <div class="field">
      <label for="itemName">What did you lose?</label>
      <input type="text" id="itemName" name="itemName" placeholder="e.g. Navy blue backpack" required>
    </div>

    <div class="two-col">
      <div class="field">
        <label for="category">Category</label>
        <select id="category" name="category">
          <option>Bag / Backpack</option>
          <option>Electronics</option>
          <option>Leptop</option>
          <option>Phone</option>
          <option>Water Bottle</option>
          <option>Keys</option>
          <option>Wallet / Purse</option>
          <option>Jewelry</option>
          <option>Documents / ID</option>
          <option>Other</option>
        </select>
      </div>
      <div class="field">
        <label for="dateLost">Date lost</label>
        <input type="date" id="dateLost" name="dateLost">
      </div>
    </div>

    <div class="field">
      <label for="location">Last seen location</label>
      <input type="text" id="location" name="location" placeholder="e.g. Near Boys Hostel">
    </div>

    <div class="field">
      <label for="description">Description</label>
      <textarea id="description" name="description" placeholder="Color, brand, any marks or details that make it recognizable..."></textarea>
    </div>

    <div class="field">
      <label for="photos">Upload photo(s)</label>
      <div class="photo-drop" id="photoDrop">
        <input type="file" id="photos" name="photos" accept="image/*" multiple>
        <div class="hint"><strong>Click to upload</strong> or drag photos here — PNG or JPG</div>
      </div>
      <div id="previewGrid"></div>
    </div>

    <div class="two-col">
      <div class="field">
        <label for="contactNumber">Contact number</label>
        <input type="tel" id="contactNumber" name="contactNumber" placeholder="e.g. 1234567890" required>
      </div>
      <div class="field">
        <label for="contactEmail">College Email</label>
        <input type="email" id="contactEmail" name="contactEmail" placeholder="1234567890@iiitvadodara.ac.in" required>
      </div>
    </div>

    <button type="submit" class="submit-btn">Pin This Notice</button>
  </form>

  <p class="note">Your contact details are only shown to people responding to this notice.</p>
</div>

<script>
  const photoInput = document.getElementById('photos');
  const photoDrop = document.getElementById('photoDrop');
  const previewGrid = document.getElementById('previewGrid');
  let selectedFiles = [];

  function renderPreviews() {
    previewGrid.innerHTML = '';
    selectedFiles.forEach((file, idx) => {
      const reader = new FileReader();
      reader.onload = (e) => {
        const thumb = document.createElement('div');
        thumb.className = 'thumb';
        thumb.innerHTML = `<img src="${e.target.result}" alt="${file.name}"><button type="button" aria-label="Remove photo">×</button>`;
        thumb.querySelector('button').addEventListener('click', () => {
          selectedFiles.splice(idx, 1);
          renderPreviews();
        });
        previewGrid.appendChild(thumb);
      };
      reader.readAsDataURL(file);
    });
  }

  photoInput.addEventListener('change', (e) => {
    selectedFiles = selectedFiles.concat(Array.from(e.target.files));
    renderPreviews();
  });

  ['dragover', 'dragleave', 'drop'].forEach(evt => {
    photoDrop.addEventListener(evt, (e) => {
      e.preventDefault();
      if (evt === 'dragover') photoDrop.classList.add('dragover');
      else photoDrop.classList.remove('dragover');
    });
  });

  photoDrop.addEventListener('drop', (e) => {
    const files = Array.from(e.dataTransfer.files).filter(f => f.type.startsWith('image/'));
    selectedFiles = selectedFiles.concat(files);
    renderPreviews();
  });

  document.getElementById('lostForm').addEventListener('submit', (e) => {
    e.preventDefault();
    document.getElementById('successMsg').style.display = 'block';
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
</script>

</body>
</html>
